<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ea" />
    <meta name="description" content="손가락으로 바로 그리고 기기에 안전하게 저장하는 오프라인 그림판" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="canonical" href="https://libralightluda.github.io/Painter/" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>손끝 — 모바일 드로잉</title>
    <style>
      .file-launch-help { display: none; }
      @media screen {
        html.file-mode,
        html.file-mode body { min-height: 100%; margin: 0; }
        html.file-mode .file-launch-help {
          display: grid;
          min-height: 100vh;
          place-items: center;
          padding: 24px;
          color: #1e1f1d;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          background: #f7f3ea;
        }
        .file-launch-card {
          width: min(100%, 520px);
          padding: 30px;
          border: 1px solid #d8d2c5;
          border-radius: 22px;
          background: #fffdf8;
          box-shadow: 0 20px 60px rgba(30, 31, 29, 0.12);
        }
        .file-launch-mark {
          display: grid;
          width: 48px;
          height: 48px;
          margin-bottom: 20px;
          place-items: center;
          color: #ff8a66;
          font-size: 28px;
          border-radius: 15px;
          background: #1e1f1d;
        }
        .file-launch-card h1 { margin: 0 0 12px; font-size: 1.55rem; }
        .file-launch-card p { margin: 0 0 12px; color: #5f5e58; line-height: 1.65; }
        .file-launch-card strong { color: #1e1f1d; }
        .file-launch-command {
          margin-top: 18px;
          padding: 13px 15px;
          overflow-wrap: anywhere;
          color: #f7f3ea;
          font-family: Consolas, monospace;
          border-radius: 11px;
          background: #1e1f1d;
        }
      }
    </style>
    <script>
      if (location.protocol === 'file:') document.documentElement.classList.add('file-mode')
    </script>
  </head>
  <body>
    <div id="root">
      <main class="file-launch-help">
        <section class="file-launch-card">
          <div class="file-launch-mark" aria-hidden="true">↗</div>
          <h1>로컬 서버로 실행해 주세요</h1>
          <p>이 앱은 저장·오프라인 기능을 위해 <strong>웹 주소(http://)</strong>에서 실행되어야 합니다.</p>
          <p>이 폴더의 <strong>start-app.cmd</strong>를 더블클릭하면 서버와 브라우저가 자동으로 열립니다.</p>
          <div class="file-launch-command">또는 터미널에서: pnpm dev</div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
